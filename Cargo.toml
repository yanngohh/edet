[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace]
members = ["dnas/*/zomes/coordinator/*", "dnas/*/zomes/integrity/*", "tests/sweettest"]
# The Tauri shell is a desktop (native) crate; it has no wasm target and would
# fail under the `RUSTFLAGS='--cfg getrandom_backend="custom"'` build used for
# zomes. Exclude it from the workspace so `cargo build --target
# wasm32-unknown-unknown --workspace` does not try to compile it.
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
license = "AGPL-3.0"

[workspace.dependencies]
hdi = "=0.7.0"
hdk = "=0.6.0"
serde = "1.0"
holochain_serialized_bytes = "=0.0.56"

[workspace.dependencies.support]
path = "dnas/edet/zomes/coordinator/support"

[workspace.dependencies.support_integrity]
path = "dnas/edet/zomes/integrity/support"

[workspace.dependencies.transaction]
path = "dnas/edet/zomes/coordinator/transaction"

[workspace.dependencies.transaction_integrity]
path = "dnas/edet/zomes/integrity/transaction"


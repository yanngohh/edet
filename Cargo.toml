[workspace]
resolver = "2"
members = ["crates/kernel", "crates/state", "crates/node", "crates/swarm"]
exclude = ["src-tauri", "ui"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-or-later"

# **A validator fails the same way in release as the harness does in debug.**
# An overflowing add is a panic in both — a deterministic fail-stop every node
# takes at the same height — and never a silent wrap, which is the outcome that
# leaves a nonsense figure hashed into the state with both sides of the
# conservation check wrapped identically and agreeing. The cost is a few
# percent on integer arithmetic, re-measured by `just cost`.
#
# `src-tauri` is a separate workspace and does not inherit this. It is a
# wallet: it holds no ledger and sums nothing.
[profile.release]
overflow-checks = true

[workspace.dependencies]
libm = "0.2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"
sha2 = "0.10"
# The state root hashes each section's record leaves across a pool. An
# ORDERED collect over an indexed parallel iterator is what keeps that a
# constant factor rather than a consensus fault — see `root::record_leaves`.
rayon = "1"

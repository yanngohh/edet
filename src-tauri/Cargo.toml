[package]
name = "edet-tauri"
version = "0.7.0"
edition = "2021"
description = "edet desktop/mobile client — signs locally, reads and submits over a node's HTTP API"
license = "GPL-3.0-or-later"

# Standalone: excluded from the workspace (Tauri pulls webkit/gtk and its own
# build graph). Path-depends on the workspace crates.
[workspace]

# Debug builds ship to a phone over USB (`cargo tauri android build --debug`),
# and with full DWARF the packaged .so pushes the APK toward a gigabyte —
# large enough that the install itself becomes the unreliable step. Dropping
# the debug info at link time keeps the symbol table (panic backtraces still
# name functions) at a fraction of the size; a debugger session can rebuild
# without the strip when one is actually wanted.
[profile.dev]
strip = "debuginfo"

[lib]
name = "edet_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` because background mode turns the desktop window's close button
# into a hide: an app with no window and no tray icon is an app the member
# cannot get back to, and cannot quit (`lib.rs::background_arm`).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# One notification plugin for every platform this client runs on — Linux,
# Windows, macOS and Android — rather than the Android service posting its own
# and the desktop growing a second path. What it carries is the one thing a
# member who is not looking at the app needs to be told: their acceptance rule
# signed a purchase in their name.
tauri-plugin-notification = "2"
# No `edet-node`. The client used to depend on the whole node — engine,
# store, consensus — to serve its own reads in-process. It reads over HTTP
# now, so the ledger crates are not in this build graph at all; what is left
# is a WebView, custody, and the shell plugin. (This is also most of the APK:
# the packaged .so was ~48 MB of it.)
# `serde` only, and only for `android_keystore`'s two plugin payloads. The
# node's view types were what needed `serde_json` here; they are the node's
# business now.
serde = { version = "1", features = ["derive"] }
# OS keychain for the identity-vault device key: macOS/iOS Keychain, Windows
# Credential Manager, Linux freedesktop Secret Service (zbus, pure Rust — no
# libdbus at build time). NOT compiled for Android: keyring has no Android
# Keystore backend and would silently fall back to a non-persistent mock
# store — the keychain commands refuse there and the UI uses the app-sandbox
# storage path instead. Real Android custody needs a small Tauri mobile
# plugin (Kotlin + Android Keystore); tracked as the follow-up.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

# Linux only, and the same version Tauri itself links: wry wires NO WebKit
# permission handling on this platform, so getUserMedia — the QR scanner —
# is refused before anyone is asked. The setup hook reaches the raw WebView
# to enable media streams and allow camera requests (see lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# There was a `[patch.crates-io]` here pinning a vendored `libp2p-dns`:
# Android has no /etc/resolv.conf, libp2p's DNS transport read it at swarm
# construction, and the network actor died at startup before consensus ever
# ran. The client builds no libp2p at all now — it runs no consensus — so the
# patch applied to nothing and cargo said so on every build. Whoever needs it
# next is the NODE, which is not this crate.

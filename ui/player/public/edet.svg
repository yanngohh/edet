<svg xmlns="http://www.w3.org/2000/svg" viewBox="-33.2 -30 160 160">
  <rect x="-33.2" y="-30" width="160" height="160" rx="32" fill="#7B1FA2"/>
  
  <!-- Concentric ripple circles -->
  <circle cx="50" cy="50" r="8" fill="#FFFFFF"/>
  
  <!-- Central agent -->
  <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
  
  <!-- Satellites at ripple ends -->
  <circle cx="70" cy="38" r="5.2" fill="#FFFFFF"/>
  <circle cx="85" cy="57" r="4.5" fill="#FFFFFF"/>
  <circle cx="40" cy="13" r="6.7" fill="#FFFFFF"/>
  <circle cx="70" cy="62" r="5.8" fill="#FFFFFF"/>
  <circle cx="50" cy="72" r="4.3" fill="#FFFFFF"/>
  <circle cx="25" cy="83" r="3.5" fill="#FFFFFF"/>
  <circle cx="15" cy="57" r="2.8" fill="#FFFFFF"/>
  <circle cx="20" cy="38" r="3.5" fill="#FFFFFF"/>

  <!-- Mesh lines (trust connections) -->
  <line x1="50" y1="50" x2="70" y2="38" stroke="#FFFFFF" stroke-width="3.5"/>
  <line x1="50" y1="50" x2="70" y2="62" stroke="#FFFFFF" stroke-width="4.2"/>
  <line x1="50" y1="50" x2="50" y2="72" stroke="#FFFFFF" stroke-width="3.2"/>
  <line x1="50" y1="50" x2="15" y2="57" stroke="#FFFFFF" stroke-width="2.8"/>
  <line x1="50" y1="50" x2="20" y2="38" stroke="#FFFFFF" stroke-width="3.6"/>


  <!-- Mesh lines -->
  <line x1="85" y1="57" x2="70" y2="38" stroke="#FFFFFF" stroke-width="3.5"/>
  <line x1="70" y1="38" x2="40" y2="13" stroke="#FFFFFF" stroke-width="4.3"/>
  <line x1="85" y1="57" x2="70" y2="62" stroke="#FFFFFF" stroke-width="4.2"/>
  <line x1="25" y1="83" x2="50" y2="72" stroke="#FFFFFF" stroke-width="3.2"/>
  <line x1="15" y1="57" x2="25" y2="83" stroke="#FFFFFF" stroke-width="2.8"/>
  <line x1="40" y1="13" x2="20" y2="38" stroke="#FFFFFF" stroke-width="3.6"/>
</svg>

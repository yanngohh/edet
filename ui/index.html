<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>edet</title>

    <link rel="stylesheet" href="/smui.css" id="smui-theme" />
    <link rel="stylesheet" href="/global.css" />

    <script>
      // Apply the persisted theme before first paint to avoid a light flash.
      (function () {
        const savedTheme = localStorage.getItem("edet-theme") || "system";
        const darkState =
          savedTheme === "dark" ||
          (savedTheme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        const themeLink = document.getElementById("smui-theme");
        if (darkState) {
          themeLink.href = "/smui-dark.css";
          document.documentElement.classList.add("dark-theme");
        } else {
          themeLink.href = "/smui.css";
          document.documentElement.classList.remove("dark-theme");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

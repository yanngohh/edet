name: ci

# Determinism assumption (binding on kernel authors, not just a CI note):
# every transcendental in crates/kernel goes through `libm` (pure-Rust
# software implementations), never the platform libm — no FMA, no mul_add,
# no fast-math contraction — so consensus-critical kernel math is
# bit-identical on every validator regardless of CPU/OS. Every job below runs
# on ubuntu-latest/x86_64 only: no gate runs the kernel suite on a second
# architecture and diffs its fixture hashes, so cross-architecture
# bit-identity is an argument from the construction, not a measurement.

# This workflow runs `just ci` and nothing else, on purpose.
#
# A gate list written twice drifts: a fix to "CI" lands in the justfile and a
# workflow with its own copy goes on running the old list — clippy skipping
# the feature-gated code, `test` skipping two of its three lines, `src-tauri`
# never resolved, the engine BUILT but never RUN, which is the hole a failing
# byzantine test and a broken log format walk through.
#
# One list, in the justfile, invoked from here. A gate added there is a gate
# that runs on push, with no second place to remember.

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # `engine-test` and `e2e` start real multi-node clusters over loopback TCP
    # and are the slowest lines by far (~3 min between them). The cap is
    # generous enough for a loaded runner and short enough that a consensus
    # hang fails instead of burning time.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # `just sim` cross-pins the kernel against an independent scipy/numpy
      # reference; `just ui-check`/`ui-test`/`e2e` need the node toolchain.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: extractions/setup-just@v3

      - name: Simulation dependencies
        run: pip install -r sim/requirements.txt

      # Every Rust gate in `just ci` runs through `cargo nextest run`, so
      # without this the list does not fail a test — it fails at "no such
      # subcommand" before running one. `nix develop` supplies it on the
      # machine (`pkgs.cargo-nextest` in the default shell); there is no nix
      # here. The action fetches the release binary; `cargo install` would
      # compile it from source on every run for the same result.
      - uses: taiki-e/install-action@nextest

      # `just audit`'s cargo half skips itself with a notice when this is
      # absent, so installing it here is what makes the Rust advisory check
      # actually run in CI rather than quietly pass.
      - name: cargo-audit
        run: cargo install cargo-audit --locked

      # `just tauri-check` compiles the desktop/mobile client, which links
      # webkit2gtk. On this machine those come from `nix develop .#tauri`;
      # there is no nix here, so the runner needs them from apt or the gate
      # cannot run — and a gate that cannot run is the hole it was added to
      # close. Same reason as cargo-audit above: the install is what makes
      # the check real.
      - name: Tauri client system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev

      # The engine's multi-node tests bind fixed consensus ports from a base
      # (default 26600). Nothing else should hold them on a fresh runner, but
      # naming the base here documents the dependency and gives one place to
      # move it if a hosted image ever does.
      - name: just ci
        run: just ci
        env:
          EDET_CONSENSUS_BASE_PORT: "26600"
